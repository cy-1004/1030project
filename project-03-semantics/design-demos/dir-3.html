<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C · 语义任务中心</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Microsoft YaHei','PingFang SC',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #6ba6fb;outline-offset:3px}button{min-height:36px}p{line-height:1.8}.logo{display:flex;align-items:center;gap:11px;font-weight:700}.logo b{display:grid;place-items:center;width:33px;height:33px;border-radius:9px;font-size:18px}small{font-size:12px}.tag{font-size:12px;display:inline-flex;align-items:center;border-radius:4px;padding:4px 8px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panel-title h2{font-size:16px;font-weight:600}.panel-title button{font-size:12px;padding:7px 12px;border-radius:5px}.doc-body{white-space:pre-wrap;font-size:14px;line-height:2.1;min-height:305px}textarea{width:100%;min-height:305px;resize:vertical;border-radius:6px;padding:15px;font-size:14px;line-height:1.9}.term-chip,.entity{display:inline-flex;font-size:12px;padding:7px 10px;margin:0 7px 8px 0;border-radius:5px}.term-chip{min-height:32px}.inline-term{border:0;border-radius:3px;padding:0 4px;min-height:0;line-height:1.8;font-size:inherit}.term-detail{padding:14px;border-radius:7px;margin-top:12px}.term-detail strong{font-size:14px}.term-detail p{font-size:12px;margin-top:8px}.summary{font-size:14px;line-height:1.9;margin-bottom:20px}.group-label{font-size:12px;font-weight:600;margin:22px 0 12px;display:flex;justify-content:space-between}.qa-input{display:flex;gap:8px}.qa-input input{min-width:0;flex:1;border-radius:6px;padding:11px 13px;font-size:13px}.qa-input button{border:0;border-radius:6px;padding:0 19px;font-size:13px}.question-hints{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}.question-hints button{font-size:12px;min-height:30px;padding:4px 8px;border-radius:4px}.answer{font-size:13px;line-height:1.9}.evidence{font-size:12px;line-height:1.8;border-left:2px solid;padding-left:12px;margin-top:12px}.note{font-size:12px}.scene-control{display:flex;align-items:center;gap:9px}.scene-control select{padding:9px 14px;border-radius:6px;font-size:13px}.primary{padding:10px 18px;border:0;border-radius:6px;font-size:13px;font-weight:600}.pipeline{display:flex;gap:9px;align-items:center;font-size:12px}.pipeline span{padding:9px 13px;border-radius:5px}.pipeline i{font-style:normal;opacity:.45}.workspace{min-width:0}.rail button{display:flex;align-items:center;gap:10px;border:0;font-size:13px;text-align:left;border-radius:6px;padding:12px 13px;width:100%;margin-bottom:6px}.meta-line{display:flex;gap:15px;align-items:center;font-size:12px;margin-bottom:15px}.count{font-weight:600}

body{background:#e9eeed;color:#243e3c}.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.rail{padding:28px 22px;background:#153c3c;color:#c6dddd}.logo{margin-bottom:45px;font-size:17px}.logo b{background:#c3d8cb;color:#1a4140}.rail button{background:none;color:#90b3b0;min-height:45px}.rail button.active{background:#2c5351;color:#e2f2ed}.rail small{color:#78a3a0;display:block;margin:35px 13px 15px}.rail p{color:#9dbdb9;font-size:12px;padding:8px 13px}.header{background:#f8fbf9;border-bottom:1px solid #d5dfd9;height:75px;padding:0 35px;display:flex;align-items:center;justify-content:space-between}.header h1{font-size:20px}.header .tag{background:#e2ece7;color:#6d9180}.content{padding:30px 35px}.top-line{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.pipeline{font-size:12px;gap:5px}.pipeline span{background:#d9e6e1;color:#6d8f82;padding:9px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}.source-panel{grid-column:1/-1;background:#fcfefd;border:1px solid #d4e0d9;border-radius:8px;padding:25px 32px;display:grid;grid-template-columns:1.1fr .9fr;gap:0 30px}.source-panel .panel-title,.source-panel .meta-line{grid-column:1/-1}.source-panel .doc-body,.source-panel textarea{grid-column:1/-1;min-height:215px;column-count:1;column-gap:42px;font-size:13px}.source-panel .source-foot{grid-column:1/-1}.result-panel,.qa-panel{background:#f9fcfa;border:1px solid #d3e0d8;border-radius:8px;padding:25px}.panel-title button{background:#e7f0ea;border:1px solid #cadbd0;color:#739782}.tag{background:#e1eee6;color:#719e82}.meta-line{color:#94aa9c}.inline-term{background:#d6e8dd;color:#407858}.doc-body{color:#627d70}.source-foot{font-size:12px;color:#9aafa2;margin-top:15px}.summary{font-size:13px;color:#799184}.term-chip{background:#e4f0e8;border:1px solid #c8dfd0;color:#628d71}.entity{background:#e5edf2;color:#8097a7}.group-label{color:#6f8b7c}.term-detail{background:#edf4ee;color:#5d8869;border:1px solid #d2e3d5}.term-detail p{color:#91a997}.scene-control select,textarea,.qa-input input{background:#fff;border:1px solid #c7d9cd;color:#64816e}.primary,.qa-input button{background:#286455;color:#fff}.question-hints button{background:#edf5ee;border:1px solid #d5e4d9;color:#7a9b86}.answer{color:#698576}.evidence{color:#7c9c87;border-color:#a5c2ae}.note{color:#9fb1a6}.footer{font-size:12px;margin-top:24px;color:#8fa69a}@media(max-width:850px){.layout{display:block}.rail{display:none}.header{padding:18px;height:auto;gap:15px}.content{padding:18px}.top-line{flex-direction:column;align-items:start}.grid{grid-template-columns:1fr}.source-panel{grid-column:auto;padding:21px}.source-panel .doc-body{column-count:1}.pipeline{overflow:auto;width:100%;white-space:nowrap}}
</style></head><body><div class="layout"><aside class="rail"><div class="logo"><b>联</b>语义任务中心</div><button class="active" data-local-nav>▤　语义工作台</button><button data-local-nav>◇　术语与规则</button><button data-local-nav>◷　处理记录</button><small>业务场景</small><p>合同与履约</p><p>问题与服务</p><p>经营与观察</p></aside><main class="workspace"><header class="header"><h1>业务文本理解</h1><span class="tag">演示任务空间</span></header><div class="content"><div class="top-line"><div class="scene-control"><select aria-label="业务场景" onchange="loadScene(this.value)"><option value="contract">合同审阅</option><option value="support">客服工单</option><option value="research">经营研报</option></select><button class="primary" onclick="analyze()">开始分析</button></div><div class="pipeline"><span>文本预处理</span><i>›</i><span>术语映射</span><i>›</i><span>实体提取</span><i>›</i><span>结果整理</span></div></div><div class="grid"><section class="source-panel"><div class="panel-title"><h2>原文与术语</h2><button id="editButton" onclick="edit()">编辑原文</button></div><div class="meta-line"><span class="tag">虚构样例</span><span id="docTitle"></span></div><textarea id="docInput" aria-label="输入文本" hidden></textarea><div class="doc-body" id="docText"></div><div class="source-foot">点击高亮术语，查看当前场景的解释。</div></section><section class="result-panel"><div class="panel-title"><h2>解析结果</h2><span class="tag">本地规则</span></div><p class="summary" id="summary"></p><div class="group-label">术语映射 <span><b id="mappedCount">0</b> 项</span></div><div id="termList"></div><div class="term-detail"><strong id="termTitle"></strong><p id="termDetail"></p></div><div class="group-label">关键实体 <span><b id="entityCount">0</b> 项</span></div><div id="entityList"></div></section><section class="qa-panel"><div class="panel-title"><h2>向文档提问</h2><span class="note">回答附原文依据</span></div><div class="qa-input"><input id="question" aria-label="问题" placeholder="输入你关心的问题"><button onclick="ask()">提问</button></div><div id="questionHints" class="question-hints"></div><p class="answer" id="answer"></p><div class="evidence" id="evidence"></div></section></div><div class="footer" id="resultNote"></div></div></main></div><script>
const DATA={"samples": [{"id": "contract-demo", "scene": "contract", "title": "数字展厅服务合同", "text": "数字展厅服务合同\n合同编号：SC-2026-018。\n甲方：星河文化有限公司；乙方：远山数字有限公司。\n服务期限为2026年11月1日至2027年10月31日。\n本合同总价为120,000元，首付款占合同金额的30%，甲方应于合同签订后5个工作日内支付。\n乙方应于2026年12月15日前完成交付，交付内容包括网站、素材库与操作手册。\n甲方应在收到交付成果后10个工作日内完成验收，验收通过后支付剩余款项。\n逾期未履约的一方应承担相应违约责任；涉及保密信息的资料不得向第三方披露。", "questions": ["服务期限是什么？", "合同金额是多少？", "交付与验收如何安排？"]}, {"id": "support-demo", "scene": "support", "title": "企业账号登录异常工单", "text": "客户服务工单\n工单编号：CS-2026-042。\n客户单位为星河文化有限公司，反馈企业账号无法登录，页面显示“权限不足”。\n经排查，问题由账号角色配置缺失引起，影响范围为编辑人员，管理员账号正常。\n当前优先级为P1，处理负责人为陈明，计划在2026年11月2日18:00前恢复。\n本次交付是向客户提供可使用的账号权限与处理说明，并非发布新的软件版本。\n客服应在恢复后回访客户，确认问题解决后关闭工单。\n如同类问题再次出现，应重新打开工单并升级给技术负责人。", "questions": ["客户遇到了什么问题？", "谁负责处理，什么时候恢复？", "工单关闭前需要做什么？"]}, {"id": "research-demo", "scene": "research", "title": "经营观察简报", "text": "经营观察简报（演示数据）\n星河文化有限公司2026年第三季度营收为860万元，同比增长12%。\n订阅业务收入占比为65%，其余为项目服务收入；毛利率为48%。\n本季度新增签约客户32家，流失客户4家，续费率为92%。\n项目交付是本期确认收入的业务节点，与合同中交付成果的技术含义不同。\n截至2026年9月30日，应收账款余额为210万元，回款周期为45天。\n本报告建议优先跟进逾期回款，同时提升存量客户续费体验。\n以上金额与客户信息均为虚构，仅用于产品演示。", "questions": ["本季度营收和增长情况如何？", "订阅收入占比是多少？", "报告提出了什么建议？"]}], "terms": {"contract": [["交付", "成果移交", "乙方向甲方移交约定的网站、素材或文档。", ["交付成果"]], ["甲方", "委托方", "合同中委托服务并支付费用的一方。", []], ["乙方", "服务方", "合同中按约定提供服务和成果的一方。", []], ["履约", "履行约定义务", "依照合同约定完成应承担的义务。", []], ["验收", "成果确认", "检查服务成果是否达到约定要求。", []], ["首付款", "首期付款", "按照合同在前期支付的部分款项。", ["预付款"]], ["工作日", "业务办理日", "通常指约定可办理业务的日期，具体按合同解释。", []], ["违约责任", "违约承担", "未履行合同义务时应承担的责任。", []], ["服务期限", "合同服务期间", "合同约定提供服务的起止时间。", []], ["保密信息", "受限披露资料", "按约定不得随意向第三方披露的信息。", []]], "support": [["交付", "服务恢复反馈", "向客户提供已恢复的可用能力和处理说明。", []], ["工单", "问题处理记录", "用于跟踪客户问题及处理过程的记录。", []], ["P1", "高优先级", "本演示中表示需要优先处理的业务问题。", []], ["权限不足", "授权缺失", "当前账号没有执行相应操作的授权。", []], ["回访", "结果确认", "主动向客户确认处理效果。", []], ["关闭工单", "结束处理记录", "完成结果确认后结束当前处理流程。", []], ["重新打开", "恢复问题跟踪", "问题再次出现时恢复处理记录。", []], ["升级", "提高处理层级", "将问题交由更高层级或专业人员处理。", []], ["影响范围", "受影响对象", "受到当前问题影响的账号、人员或服务。", []], ["处理负责人", "问题责任人", "负责协调或完成本次问题处理的人员。", []]], "research": [["交付", "收入确认节点", "本演示研报中表示项目达到收入确认的业务节点。", ["项目交付"]], ["营收", "营业收入", "统计期间内的主营及相关经营收入。", ["收入"]], ["同比增长", "与上年同期比较", "与上一年相同统计期间相比的增长情况。", []], ["毛利率", "毛利占收入比例", "收入扣除直接成本后毛利所占比例。", []], ["续费率", "客户续订比例", "到期客户中继续购买订阅的比例。", []], ["应收账款", "待收款项", "已经形成但尚未实际收到的款项。", []], ["回款周期", "收款所需时间", "从业务确认到收到款项所经历的时间。", []], ["存量客户", "现有客户", "已经建立服务关系的客户。", []], ["流失客户", "停止合作客户", "统计期间内终止或不再续订的客户。", []], ["订阅业务", "周期付费服务", "客户按周期支付费用获得持续服务的业务。", []]]}};let scene='contract';
const $=id=>document.getElementById(id);
function add(tag,txt,parent,cls=''){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.appendChild(e);return e}
function loadScene(v){scene=v;const sample=DATA.samples.find(s=>s.scene===scene);$('docInput').value=sample.text;$('docTitle').textContent=sample.title;$('question').value=sample.questions[0];$('questionHints').replaceChildren();sample.questions.forEach(q=>{const b=add('button',q,$('questionHints'));b.onclick=()=>{$('question').value=q;ask()}});analyze()}
function analyze(){const text=$('docInput').value;if(!text.trim()){alert('请填写需要分析的文本');return}const terms=DATA.terms[scene].filter(t=>[t[0],...t[3]].some(w=>text.includes(w)));$('termList').replaceChildren();terms.forEach(t=>{const b=add('button',t[0],$('termList'),'term-chip');b.onclick=()=>{$('termTitle').textContent=t[0]+' → '+t[1];$('termDetail').textContent=t[2]}});$('summary').textContent=text.split('\n').filter(s=>s.length>20).slice(0,2).join(' ');$('mappedCount').textContent=terms.length;$('entityList').replaceChildren();const vals=[...new Set(text.match(/20\d{2}年\d{1,2}月\d{1,2}日|\d[\d,]*元|\d+%|[A-Z]{2}-\d{4}-\d{3}/g)||[])];vals.forEach(v=>add('span',v,$('entityList'),'entity'));$('entityCount').textContent=vals.length;$('termTitle').textContent=terms[0]?terms[0][0]+' → '+terms[0][1]:'没有命中词条';$('termDetail').textContent=terms[0]?terms[0][2]:'可调整文本或添加术语。';$('docText').replaceChildren();let pos=0;const word=terms.find(t=>t[0]==='交付')?.[0]||terms[0]?.[0];if(word){for(const m of text.matchAll(new RegExp(word,'g'))){add('span',text.slice(pos,m.index),$('docText'));const btn=add('button',word,$('docText'),'inline-term');btn.onclick=()=>{const term=terms.find(t=>t[0]===word);$('termTitle').textContent=word+' → '+term[1];$('termDetail').textContent=term[2]};pos=m.index+word.length}}add('span',text.slice(pos),$('docText'));$('resultNote').textContent='本地样例解析完成 · 当前规则版本 v1';$('answer').textContent='点击一个问题，查看可核对的原文依据。';$('evidence').textContent='';}
function ask(){const q=$('question').value;const text=$('docInput').value;const cues=[[/期限|多久/,['期限']],[/金额|总价/,['总价']],[/交付|验收/,['交付','验收']],[/问题|异常/,['反馈','问题由']],[/负责|恢复/,['负责人','计划在']],[/关闭/,['关闭工单']],[/营收|增长/,['营收']],[/订阅|占比/,['占比']],[/建议/,['建议']]];const keys=cues.find(([r])=>r.test(q))?.[1]||[];const found=text.split('\n').filter(s=>keys.some(k=>s.includes(k))).slice(0,2);$('answer').textContent=found.length?'根据当前原文：'+found.join(' '):'原文中未找到足够依据。';$('evidence').textContent=found.length?'原文依据：'+found[0]:'';}
function edit(){const on=$('docInput').hidden;$('docInput').hidden=!on;$('docText').hidden=on;$('editButton').textContent=on?'查看高亮':'编辑原文'}
document.querySelectorAll('[data-local-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-local-nav]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('resultNote').textContent='此初稿展示当前分析界面；'+b.textContent+'将在正式版接入。'});
loadScene('contract');
</script></body></html>
